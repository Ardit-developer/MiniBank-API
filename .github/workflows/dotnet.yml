name: .NET Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore MiniBank.sln

    - name: Build Solution
      run: dotnet build MiniBank.sln --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test MiniBank.sln --no-build --configuration Release --verbosity normal
