name: .NET Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore MiniBank.sln

    - name: Build
      run: dotnet build MiniBank.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test MiniBank.sln --no-build --configuration Release --verbosity normal
